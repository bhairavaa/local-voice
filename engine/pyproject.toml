[project]
name = "local-voice"
version = "0.1.0"
description = "Offline speech and text-processing engine for Local Voice"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "platformdirs>=4.3",
    "psutil>=6.1",
    "numpy>=2.1",
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx2>=0.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psutil>=6.1",
]

[project.scripts]
laa-engine = "app.__main__:main"
laa-dictate = "app.tools.dictate:main"
laa-benchmark = "app.tools.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # import sorting
    "N",                # naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "A",                # builtin shadowing
    "C4",               # comprehensions
    "SIM",              # simplify
    "TID",              # tidy imports
    "RUF",
    "ANN",              # annotations
    "ASYNC",
    "S",                # bandit
    "T20",              # no print()
    "FIX",              # no FIXME/TODO
    "ERA",              # no commented-out code
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Tests assert freely and use obviously-fake credentials and rejected host values.
"tests/**" = ["S101", "S104", "S105", "S106", "ANN201", "ANN001"]
# Command-line tools report to the terminal; that is their entire purpose.
"app/tools/**" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Third-party packages that ship no type information. Each is confined to a single adapter
# module, so the untyped surface never reaches the domain or the pipeline.
[[tool.mypy.overrides]]
module = ["sounddevice", "faster_whisper", "faster_whisper.*", "ctranslate2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not slow'"
markers = [
    "slow: requires real models or hardware; excluded from the default run",
]
